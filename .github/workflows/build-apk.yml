name: Сборка APK для Flet 0.27.6

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить Flet 0.27.6
        run: |
          pip install flet==0.27.6

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить Flutter (последнюю стабильную)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Собрать APK
        run: |
          export FLET_MAIN_SCRIPT=ui.py
          flet build apk --verbose

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-apk
          path: build/apk/release/app-release.apk
