name: Сборка APK для Flet 0.25.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить Flet 0.25.0
        run: |
          pip install flet==0.25.0

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Собрать APK и прописать название
        run: |
          export FLET_MAIN_SCRIPT=ui.py
          flet build apk --verbose
          # После сборки правим AndroidManifest.xml
          find build -name "AndroidManifest.xml" -exec sed -i 's/android:label="[^"]*"/android:label="Калькулятор калорий"/g' {} \;

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Калькулятор-калорий
          path: build/apk/release/app-release.apk
